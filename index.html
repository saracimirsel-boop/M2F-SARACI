<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M2F SARACI - Kartëvizitë Dixhitale</title>
    <style>
        :root {
            --primary-color: #f59e0b;
            --primary-dark: #d97706;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, var(--bg-color), #020617);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card-container {
            width: 100%;
            max-width: 400px;
            background: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.4);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            position: relative;
        }
        .card-header {
            background: linear-gradient(180deg, rgba(245, 158, 11, 0.15) 0%, transparent 100%);
            padding: 35px 20px 20px 20px;
        }
        .logo-circle {
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            border-radius: 50%;
            margin: 0 auto 15px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            color: #000;
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.4);
        }
        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }
        .subtitle {
            color: var(--primary-color);
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        .slogan {
            color: var(--text-muted);
            font-size: 13px;
            font-style: italic;
            margin-bottom: 20px;
        }
        .card-body {
            padding: 0 25px 35px 25px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-color);
            text-decoration: none;
            padding: 14px 20px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 500;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.3s ease;
        }
        .btn:hover {
            background: var(--primary-color);
            color: #000;
            border-color: var(--primary-color);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(245, 158, 11, 0.3);
        }
        .btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }
        .save-contact {
            background: var(--primary-color);
            color: #000;
            font-weight: 700;
        }
        .save-contact:hover {
            background: var(--primary-dark);
            color: #fff;
        }
        .footer-info {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 15px;
        }
    </style>
</head>

            const a = document.createElement('a');
            a.href = url;
            a.download = 'Mirsel_Saraci_M2F.vcf';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            window.URL.revokeObjectURL(url);
