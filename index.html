<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>M2F SARACI - Kartëvizitë Dixhitale</title>
    <style>
        /* Reset & Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        :root {
            --bg-dark: #0a0a0a;
            --card-bg: #111111;
            --gold: #c89b3a;
            --gold-hover: #e0ac3f;
            --text-light: #ffffff;
            --text-muted: #a0a0a0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Main Container - Mimicking Phone Screen */
        .digital-card {
            width: 100%;
            max-width: 390px; /* Perfect width for phone display */
            background-color: var(--card-bg);
            border-radius: 32px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.05);
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Logo and Header */
        .logo-container {
            margin-bottom: 30px;
            text-align: center;
        }

        .logo-img {
            width: 120px; /* Sizing the logo */
            height: auto;
            margin-bottom: 10px;
        }

        .company-name {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--text-light);
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        /* Main Action Button (vCard) */
        .main-action-btn {
            width: 100%;
            background: linear-gradient(145deg, var(--gold), #a87f2e);
            color: #000;
            border: none;
            border-radius: 20px;
            padding: 24px 16px;
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            box-shadow: 0 10px 25px -5px rgba(200, 155, 58, 0.3);
        }

        .main-action-btn:hover {
            background: linear-gradient(145deg, var(--gold-hover), var(--gold));
            transform: translateY(-3px);
            box-shadow: 0 12px 30px -5px rgba(200, 155, 58, 0.5);
        }

        .icon-vcard {
            width: 32px;
            height: 32px;
            margin-bottom: 8px;
            fill: #000;
        }

        .btn-text-main {
            font-size: 18px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Contact Buttons Group */
        .contact-group {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 16px;
        }

        .contact-btn {
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--text-light);
            text-decoration: none;
            border-radius: 16px;
            padding: 20px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            transition: background-color 0.3s ease, transform 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .contact-btn:hover {
            background-color: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .btn-icon {
            width: 24px;
            height: 24px;
            margin-bottom: 10px;
            fill: var(--gold);
        }

        .btn-data {
            font-size: 15px;
            font-weight: 600;
            word-break: break-word;
        }
        
        .btn-label {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Single Info Rows (Email & Address) */
        .info-row {
            width: 100%;
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--text-light);
            text-decoration: none;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            transition: background-color 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .info-row:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .info-icon {
            width: 20px;
            height: 20px;
            margin-right: 12px;
            flex-shrink: 0;
            fill: var(--gold);
        }

        .info-text {
            font-size: 14px;
            font-weight: 500;
            flex-grow: 1;
            word-break: break-word;
        }

        /* Small QR Hint at bottom */
        .qr-hint {
            margin-top: 25px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.3);
            text-align: center;
        }

    </style>
</head>
<body>

    <div class="digital-card">

                <span class="btn-data">WhatsApp</span>

            </a>
        </div>

        <!-- Info Row: Email -->
        <a href="mailto:saracimirsel@gmail.com" class="info-row" title="Dërgo Email M2F SARACI">

            <span class="info-text">saracimirsel@gmail.com</span>

        <!-- Info Row: Address -->

        <!-- QR Hint -->
        <div class="qr-hint">Skanoni për kartëvizitën dixhitale</div>

    </div>

    <!-- JavaScript for vCard download -->
    <script>
        function downloadVCard() {
            // Definimi i të dhënave të kontaktit në formatin vCard (v4.0)
            const vcardData = 
`BEGIN:VCARD
VERSION:4.0
FN:Mirsel Saraci
N:Saraci;Mirsel;;;
ORG:M2F SARACI
TITLE:Costruzioni & Ristrutturazioni
TEL;TYPE=work,voice:+393336689211
TEL;TYPE=cell,voice:+393534126263
EMAIL;TYPE=work:saracimirsel@gmail.com
ADR;TYPE=work:;;Via Girolamo Graziani 70;Modena;;;Italy
END:VCARD`;

            // Krijimi i skedarit dhe shkarkimi automatik
            const blob = new Blob([vcardData], { type: 'text/vcard;charset=utf-8' });
            const url = window.URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'M2F_Saraci.vcf';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            window.URL.revokeObjectURL(url);
        }
    </script>

</body>
</html>
