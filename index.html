<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M2F SARACI | Costruzione & Ristrutturazione</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome për ikona -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #c9d1d9;
            overflow-x: hidden;
        }

        header {
            background: linear-gradient(135deg, #161b22, #0d1117);
            padding: 1.5rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #30363d;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: #58a6ff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .contacts-top {
            display: flex;
            gap: 1.5rem;
            font-size: 0.9rem;
            color: #8b949e;
        }

        .contacts-top a {
            color: #c9d1d9;
            text-decoration: none;
            transition: color 0.2s;
        }

        .contacts-top a:hover {
            color: #58a6ff;
        }

        .hero {
            text-align: center;
            padding: 4rem 2rem;
            background: radial-gradient(circle at center, #1f6feb22 0%, transparent 70%);
        }

        .hero h1 {
            font-size: 2.8rem;
            color: #ffffff;
            margin-bottom: 0.5rem;
        }

        .hero h1 span {
            color: #58a6ff;
        }

        .hero p {
            font-size: 1.2rem;
            color: #8b949e;
            max-width: 700px;
            margin: 0 auto 2rem auto;
            font-style: italic;
        }

        .btn {
            display: inline-block;
            background-color: #238636;
            color: white;
            padding: 0.8rem 2rem;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            transition: background 0.3s ease, transform 0.2s;
            box-shadow: 0 4px 12px rgba(35, 134, 54, 0.4);
        }

        .btn:hover {
            background-color: #2ea043;
            transform: translateY(-2px);
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 3rem 2rem;
        }

        .section-title {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 2.5rem;
            color: #ffffff;
            border-bottom: 2px solid #30363d;
            display: inline-block;
            padding-bottom: 5px;
            left: 50%;
            position: relative;
            transform: translateX(-50%);
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }

        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 10px;
            overflow: hidden;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: #58a6ff;
        }

        .card-img {
            width: 100%;
            height: 230px;
            background-color: #21262d;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #8b949e;
            position: relative;
            overflow: hidden;
        }
        
        .card-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .card:hover .card-img img {
            transform: scale(1.05);
        }

        .card-content {
            padding: 1.5rem;
        }

        .card-content h3 {
            color: #ffffff;
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
        }

        .card-content p {
            color: #8b949e;
            font-size: 0.9rem;
        }

        footer {
            text-align: center;
            padding: 2.5rem;
            background-color: #161b22;
            border-top: 1px solid #30363d;
            color: #8b949e;
            margin-top: 4rem;
        }

        footer p {
            margin-bottom: 0.5rem;
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 1rem;
                text-align: center;
            }
            .contacts-top {
                flex-direction: column;
                gap: 0.3rem;
            }
            .hero h1 {
                font-size: 2.2rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <i class="fa-solid fa-helmet-safety"></i> M2F SARACI
        </div>
        <div class="contacts-top">
            <div>
